name: Build Chess Assistant Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Cache assets and engine sources
        uses: actions/cache@v4
        with:
          path: |
            ChessAssistantPro/.asset-cache
            ChessAssistantPro/.build-sources
          key: assets-${{ hashFiles('ChessAssistantPro/prepare_assets.py', 'ChessAssistantPro/build_stockfish19.sh', 'ChessAssistantPro/build_triumviratus.sh') }}
          restore-keys: |
            assets-

      - name: Build package
        working-directory: ./ChessAssistantPro
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-assistant-pro-deb
          path: ChessAssistantPro/packages/*.deb
